name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: python3 scripts/measure_tokens.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/bench.py --dry-run
