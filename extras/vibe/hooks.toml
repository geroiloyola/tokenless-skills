# hooks.toml — Vibe adapter of the kit (universal installer resolves {{KIT_DIR}})
# The installer scripts/install.sh writes this file to the installed .vibe root
# (~/.vibe for user scope, <project>/.vibe for --scope project) and replaces
# {{KIT_DIR}} with the install dir. Project hooks win over user hooks by name.

[[hooks]]
name = "guard-bash"
type = "pre_tool"
match = "re:bash|process_start"
command = "python3 {{KIT_DIR}}/scripts/guard.py bash"
timeout = 10.0
strict = false
description = "Bloquea comandos destructivos (rm -rf /, push --force, curl|sh, DROP...)."

[[hooks]]
name = "guard-protect-files"
type = "pre_tool"
match = "re:write_file|edit"
command = "python3 {{KIT_DIR}}/scripts/guard.py protect"
timeout = 10.0
strict = false
description = "Protege .env, lockfiles, credenciales y .git de escrituras accidentales."

# Typecheck/lint tras cada edición. Si está verde: cero ruido (stdout vacío).
# Si está rojo: inyecta los errores como additional_context, el agente los ve al instante.
# Desactiva por proyecto con: export ECC_DISABLED_HOOKS=... (ECC) o comentando este bloque.
[[hooks]]
name = "qa-after-edit"
type = "post_tool"
match = "re:edit|write_file"
command = "python3 {{KIT_DIR}}/scripts/qa.py"
timeout = 120.0
strict = false
description = "Typecheck + lint del proyecto después de cada edición; errores al contexto."

